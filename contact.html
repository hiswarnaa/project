<html>

<style>
    body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        background: #e8dfb7;
    }

    .contact-container {
        max-width: 900px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .contact-img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 25px;
    }

    .quote {
        font-size: 20px;
        font-style: italic;
        text-align: center;
        color: #444;
        margin-bottom: 30px;
    }

    .quote span {
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        color: #333;
        letter-spacing: 1px;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
        font-family: inherit;
    }

    textarea {
        height: 140px;
        resize: none;
    }

    .send-btn {
        margin-top: 15px;
        width: 100%;
        background: black;
        color: white;
        padding: 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        letter-spacing: 1px;
    }

    .send-btn:hover {
        opacity: 0.85;
    }

    h1 {
        align-self: center;
    }


    @media (max-width: 600px) {
        .quote {
            font-size: 18px;
        }
    }
</style>
</head>

<body>
    <h1>CONTACT</h1>
    <div class="contact-container">


        <img src="https://i.pinimg.com/736x/ae/4d/de/ae4ddea3db53ea19f68a1e8772d49690.jpg" class="contact-img"
            alt="Books">


        <div class="quote">
            “Between the pages of a book is a place where <span>you can escape and find yourself.</span>”
        </div>


        <form onsubmit="event.preventDefault(); alert('Message Sent!');">

            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="Message subject" required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="Write your message..." required></textarea>
            </div>

            <button class="send-btn" type="submit">Send</button>

        </form>

    </div>

</body>

</html>
