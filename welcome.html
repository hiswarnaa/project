<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #fafafa;
        text-align: center;
    }


    .title {
        margin-top: 40px;
        font-size: 32px;
        letter-spacing: 3px;
        color: #333;
    }


    .photo-grid {
        max-width: 1000px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 18px;
        padding: 0 20px;
    }

    .photo-grid img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }



    .slider {
        height: 240px;
        overflow: hidden;
        position: relative;
        width: 100%;
        margin: 40px auto;
        background: white;
    }


    .slide-track {
        display: flex;
        width: calc(350px * 8);

        animation: scroll 20s linear infinite;
    }


    .slide {
        height: 440px;
        width: 350px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
    }


    @keyframes scroll {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(calc(-350px * 4));
            /* move 4 slides left */
        }
    }


    @media (max-width: 600px) {
        .slide {
            width: 260px;
            height: 180px;
        }

        .slide-track {
            width: calc(260px * 8);
            animation: scrollMobile 20s linear infinite;
        }

        @keyframes scrollMobile {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(calc(-260px * 4));
            }
        }
    }
</style>
</head>

<body>
